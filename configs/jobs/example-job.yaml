# MySQL 到 PostgreSQL 批量同步示例

# 任务基本信息
name: "用户数据同步"
description: "从生产 MySQL 同步用户数据到分析库 PostgreSQL"
enabled: true

# 调度配置
schedule:
  # 调度类型: cron, manual, event, dependency
  type: cron
  # Cron 表达式(每天凌晨 2 点执行)
  cron: "0 2 * * *"
  # 时区
  timezone: "Asia/Shanghai"

# 数据源配置
source:
  # 插件类型
  plugin: "mysql"
  
  # 连接配置
  connection:
    host: "mysql.example.com"
    port: 3306
    database: "production"
    username: "${MYSQL_USER}"
    password: "${MYSQL_PASSWORD}"
    # 连接参数
    params:
      charset: "utf8mb4"
      parseTime: true
  
  # 读取配置
  reader:
    # 读取类型: table, query, batch
    type: "table"
    # 表名
    table: "users"
    # 列选择(为空则读取所有列)
    columns:
      - "id"
      - "username"
      - "email"
      - "created_at"
      - "updated_at"
    # WHERE 条件
    where: "status = 'active' AND created_at >= CURDATE() - INTERVAL 1 DAY"
    # 分片配置(并行读取)
    split:
      enabled: true
      # 分片键(必须是数值或时间类型)
      key: "id"
      # 分片数量
      num: 4
    # 批次大小
    batch_size: 1000

# 数据转换配置
transform:
  # 字段映射
  - type: "field_mapper"
    config:
      mappings:
        # 重命名字段
        id: "user_id"
        username: "user_name"
        email: "user_email"
  
  # 字段过滤
  - type: "filter"
    config:
      # 过滤条件(JavaScript 表达式)
      condition: "record.age >= 18"
  
  # 类型转换
  - type: "type_converter"
    config:
      conversions:
        created_at: "timestamp"
        updated_at: "timestamp"
  
  # 添加字段
  - type: "add_field"
    config:
      fields:
        sync_time: "${now()}"
        source_system: "mysql_production"

# 目标配置
sink:
  # 插件类型
  plugin: "postgresql"
  
  # 连接配置
  connection:
    host: "pg.example.com"
    port: 5432
    database: "analytics"
    username: "${PG_USER}"
    password: "${PG_PASSWORD}"
    ssl_mode: "require"
  
  # 写入配置
  writer:
    # 写入类型: insert, replace, upsert
    type: "upsert"
    # 目标表
    table: "dim_users"
    # 冲突键(upsert 模式使用)
    conflict_keys:
      - "user_id"
    # 批次大小
    batch_size: 500
    # 写入模式: sync(同步), async(异步)
    mode: "sync"

# 执行选项
options:
  # 并发控制
  concurrency:
    # Reader 并发数
    reader_workers: 4
    # Transformer 并发数
    transformer_workers: 8
    # Writer 并发数
    writer_workers: 2
  
  # 重试策略
  retry:
    # 最大重试次数
    max_attempts: 3
    # 初始延迟(秒)
    initial_delay: 5
    # 最大延迟(秒)
    max_delay: 60
    # 延迟倍数
    multiplier: 2.0
  
  # 错误处理
  error_handling:
    # 策略: abort(中止), skip(跳过), retry(重试)
    strategy: "skip"
    # 最大错误数(超过则中止)
    max_errors: 100
    # 是否记录错误数据
    log_errors: true
    # 错误数据输出路径
    error_output: "./logs/errors/${job_id}.log"
  
  # 数据验证
  validation:
    # 是否启用数据校验
    enabled: true
    # 校验模式: count(行数), sample(抽样), full(全量)
    mode: "count"
    # 抽样比例(sample 模式)
    sample_rate: 0.1

# 通知配置
notification:
  # 是否启用通知
  enabled: true
  
  # 通知场景
  on_success: true
  on_failure: true
  on_retry: false
  
  # 通知渠道
  channels:
    # 邮件通知
    - type: "email"
      config:
        recipients:
          - "admin@example.com"
        subject: "[FustGo] 任务执行结果 - ${job_name}"
    
    # Webhook 通知
    - type: "webhook"
      config:
        url: "https://hooks.example.com/fustgo"
        method: "POST"
        headers:
          Content-Type: "application/json"
