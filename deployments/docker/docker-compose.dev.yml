version: '3.8'

services:
  # FustGo 主服务 (开发环境 - 使用 SQLite)
  fustgo:
    image: fustgo:latest
    container_name: fustgo-dev
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # 数据库配置 - 使用 SQLite (默认)
      - DB_TYPE=sqlite
      - LOG_LEVEL=debug
      - SERVER_PORT=8080
    volumes:
      - ./configs:/app/configs
      - fustgo-dev-data:/app/data
      - fustgo-dev-logs:/app/logs
    restart: unless-stopped
    networks:
      - fustgo-dev-network

volumes:
  fustgo-dev-data:
    driver: local
  fustgo-dev-logs:
    driver: local

networks:
  fustgo-dev-network:
    driver: bridge